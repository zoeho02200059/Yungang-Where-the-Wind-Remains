<!DOCTYPE html>

<head>

            padding: 30px;
            align-items: flex-end;
        }

        .test {

            background: #ccc;
            padding: 10px;
        }

            width: auto;
        }

<body>

    <div class="test">
        <p>石匠甲</p>

        <img
            src="assets/characters/mason_a/body/mason_a_breath_01.png"
            alt="甲加载失败"
        >
    </div>


    <div class="test">
        <p>石匠乙</p>

        <img
            src="assets/characters/mason_b/body/mason_b_breath_01.png"
            alt="乙加载失败"
        >
    </div>

</div>

</body>
</html>
